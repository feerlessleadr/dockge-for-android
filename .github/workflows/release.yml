name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

env:
  # SHA-256 of the release signing certificate, lower case hex without colons. Public information. The build fails
  # when the APK is signed with anything else, so a wrong key can never be published. Pinned by the owner (see
  # docs/progress.md, M7).
  EXPECTED_CERT_SHA256: "e412acf41461eed0b8980319980ffce60bf6b41b5a973d7b3c7e595a0da1a0f3"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag is on main and has release notes
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main. Releases are cut from main only."
            exit 1
          fi
          if [ ! -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "::error::docs/releases/${GITHUB_REF_NAME}.md is missing. Write the release notes first."
            exit 1
          fi

      - name: Compute version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          IFS=. read -r MAJ MIN PAT <<< "$NAME"
          # Monotonic as long as minor and patch stay below 100.
          CODE=$((MAJ * 10000 + MIN * 100 + PAT))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}

      - name: Delete the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature, version and package of the APK
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::EXPECTED_CERT_SHA256 is not pinned in release.yml."
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          BT=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner.txt" \
            || grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" "$RUNNER_TEMP/apksigner.txt" \
            || { echo "::error::The APK is not signed with signature scheme v2 or v3."; exit 1; }
          # apksigner labels the line "Signer #1 certificate ..." in some versions and "V2 Signer: certificate ..." in
          # newer ones. The pattern needs the word certificate, so the "public key SHA-256 digest" line never matches.
          ACTUAL=$(grep -m1 -E "(Signer #1|V[0-9.]+ Signer:?) certificate SHA-256 digest:" "$RUNNER_TEMP/apksigner.txt" | awk '{print $NF}' | tr 'A-F' 'a-f') || true
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the signer certificate digest from the apksigner output."
            exit 1
          fi
          if [ "$ACTUAL" != "$(echo "$EXPECTED_CERT_SHA256" | tr 'A-F' 'a-f')" ]; then
            echo "::error::The APK is signed with certificate $ACTUAL, not the pinned release certificate."
            exit 1
          fi
          BADGING=$("$BT/aapt2" dump badging "$APK" | head -n1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "name='com.feerlessleadr.dockge'" || { echo "::error::Unexpected package name."; exit 1; }
          echo "$BADGING" | grep -q "versionName='${{ steps.ver.outputs.name }}'" || { echo "::error::versionName does not match the tag."; exit 1; }
          echo "$BADGING" | grep -q "versionCode='${{ steps.ver.outputs.code }}'" || { echo "::error::versionCode does not match the tag."; exit 1; }
          echo "ACTUAL_CERT=$ACTUAL" >> "$GITHUB_ENV"

      - name: Rename APK and checksum
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "dockge-for-android-${GITHUB_REF_NAME}.apk"
          sha256sum "dockge-for-android-${GITHUB_REF_NAME}.apk" > "dockge-for-android-${GITHUB_REF_NAME}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat "docs/releases/${GITHUB_REF_NAME}.md"
            echo
            echo "## Verify the download"
            echo
            echo "- APK SHA-256: \`$(cut -d' ' -f1 "dockge-for-android-${GITHUB_REF_NAME}.apk.sha256")\`"
            echo "- Signing certificate SHA-256: \`${ACTUAL_CERT}\` (the same key signs every release)"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dockge-for-android-*.apk dockge-for-android-*.apk.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
